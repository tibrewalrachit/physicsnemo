# Small CPU-friendly configuration for a quick end-to-end demo.

data:
  library: ../data/library.npz
  val_fraction: 0.1

model:
  n_layers: 3
  n_hidden: 64
  n_head: 4
  slice_num: 32
  mlp_ratio: 2
  use_te: false

training:
  seed: 0
  epochs: 12
  batch_size: 16
  lr: 1.5e-3
  weight_decay: 1.0e-5
  output_dir: ../outputs
