# DEMO variant of config_modal.yaml: identical full-size model, but falls
# back to RANDOM weights when no checkpoint is in the volume - deploy with:
#   AERO_STUDIO_MODAL_APP=geotransolver-aero-studio-demo \
#   AERO_STUDIO_CONFIG=conf/config_modal_demo.yaml modal deploy modal_app.py
# Remote-side configuration used INSIDE the Modal GPU container
# (selected at deploy time via AERO_STUDIO_CONFIG, default this file).
#
# The model/data sections must match the training recipe, exactly like
# config.yaml. The checkpoint directory points into the Modal volume
# ("aero-studio-checkpoints", mounted at /checkpoints). Upload once with:
#
#   modal volume put aero-studio-checkpoints /path/to/checkpoints /geotransolver

model:
  _target_: physicsnemo.experimental.models.geotransolver.GeoTransolver
  functional_dim: 6
  global_dim: 2
  geometry_dim: 3
  out_dim: 4
  n_layers: 20
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 2
  slice_num: 128
  use_te: false
  plus: false
  include_local_features: true
  radii: [0.01, 0.05, 0.25, 1.0, 2.5, 5.0]
  neighbors_in_radius: [4, 8, 16, 64, 128, 256]
  n_hidden_local: 32
  concrete_dropout: false

data:
  include_normals: true
  include_sdf: false
  translational_invariance: true
  scale_invariance: true
  reference_scale: [12.0, 4.5, 3.25]
  include_geometry: true
  geometry_sampling: 300000
  broadcast_global_features: false
  normalization_file: surface_fields_normalization.npz

inference:
  backend: local  # inside the container, inference is always local
  checkpoint_dir: /checkpoints/geotransolver
  allow_untrained_model: true
  chunk_size: 200000
  default_mc_samples: 0

physics:
  default_stream_velocity: 30.0
  default_air_density: 1.205
  drag_direction: [1.0, 0.0, 0.0]
  lift_direction: [0.0, 0.0, 1.0]

server:
  host: 0.0.0.0
  port: 8000
  workdir: aero_studio_jobs
  max_upload_mb: 300
  viz_max_cells: 120000
