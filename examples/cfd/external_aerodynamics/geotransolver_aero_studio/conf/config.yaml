# Production configuration for GeoTransolver Aero Studio.
#
# The model and data sections MUST match the configuration the checkpoint
# was trained with (see examples/cfd/external_aerodynamics/transformer_models,
# config geotransolver_surface). Point inference.checkpoint_dir at the
# checkpoints directory produced by that recipe.

model:
  _target_: physicsnemo.experimental.models.geotransolver.GeoTransolver
  functional_dim: 6
  global_dim: 2
  geometry_dim: 3
  out_dim: 4
  n_layers: 20
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 2
  slice_num: 128
  use_te: false
  plus: false
  include_local_features: true
  radii: [0.01, 0.05, 0.25, 1.0, 2.5, 5.0]
  neighbors_in_radius: [4, 8, 16, 64, 128, 256]
  n_hidden_local: 32
  concrete_dropout: false  # set true if the checkpoint was trained with it

data:
  # Embedding construction - must match training:
  include_normals: true
  include_sdf: false
  translational_invariance: true
  scale_invariance: true
  reference_scale: [12.0, 4.5, 3.25]
  include_geometry: true
  geometry_sampling: 300000
  broadcast_global_features: false
  # Normalization statistics used for the training targets
  # (relative paths are resolved against this config file's directory):
  normalization_file: surface_fields_normalization.npz

inference:
  # Directory of checkpoints saved by the transformer_models training recipe:
  checkpoint_dir: null
  # Refuse to run without a checkpoint unless explicitly allowed (demo only):
  allow_untrained_model: false
  # Points per forward pass; lower this if you hit GPU out-of-memory:
  chunk_size: 200000
  # Default MC-Dropout passes for uncertainty (0 = deterministic).
  # Requires a checkpoint trained with model.concrete_dropout=true.
  default_mc_samples: 0

physics:
  default_stream_velocity: 30.0  # m/s, flow along +x (DrivAerML convention)
  default_air_density: 1.205     # kg/m^3
  drag_direction: [1.0, 0.0, 0.0]
  lift_direction: [0.0, 0.0, 1.0]

server:
  host: 0.0.0.0
  port: 8000
  workdir: aero_studio_jobs
  max_upload_mb: 300
  viz_max_cells: 120000
