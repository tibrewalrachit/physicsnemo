# Demo / CI configuration: a tiny untrained GeoTransolver that runs on CPU.
#
# This exists so the full pipeline (upload -> preprocess -> model ->
# integration -> visualization) can be exercised without a GPU or a
# trained checkpoint. PREDICTIONS FROM THIS CONFIG ARE MEANINGLESS.

model:
  _target_: physicsnemo.experimental.models.geotransolver.GeoTransolver
  functional_dim: 6
  global_dim: 2
  geometry_dim: 3
  out_dim: 4
  n_layers: 2
  n_hidden: 64
  dropout: 0.0
  n_head: 4
  act: "gelu"
  mlp_ratio: 2
  slice_num: 16
  use_te: false
  plus: false
  include_local_features: false
  concrete_dropout: false

data:
  include_normals: true
  include_sdf: false
  translational_invariance: true
  scale_invariance: true
  reference_scale: [12.0, 4.5, 3.25]
  include_geometry: true
  geometry_sampling: 4096
  broadcast_global_features: false
  normalization_file: surface_fields_normalization.npz

inference:
  checkpoint_dir: null
  allow_untrained_model: true
  chunk_size: 20000
  default_mc_samples: 0

physics:
  default_stream_velocity: 30.0
  default_air_density: 1.205
  drag_direction: [1.0, 0.0, 0.0]
  lift_direction: [0.0, 0.0, 1.0]

server:
  host: 0.0.0.0
  port: 8000
  workdir: aero_studio_jobs
  max_upload_mb: 300
  viz_max_cells: 120000
